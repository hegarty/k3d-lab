# selfsigned-issuer.yaml — ClusterIssuer using self-signed certificates
# Used as the root to bootstrap the CA issuer.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# Self-signed root CA certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k3d-lab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: k3d-lab-ca
  subject:
    organizations:
      - k3d-lab
    organizationalUnits:
      - Platform Engineering
  secretName: k3d-lab-ca-secret
  duration: 87600h  # 10 years
  renewBefore: 8760h  # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
