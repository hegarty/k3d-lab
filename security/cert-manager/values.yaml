# cert-manager Helm values for k3d

# Install CRDs as part of the Helm chart
crds:
  enabled: true
  keep: true

# Replica count
replicaCount: 1

# Resources
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Webhook resources
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# CAInjector resources
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Prometheus metrics
prometheus:
  enabled: true
  servicemonitor:
    enabled: false  # Enable after kube-prometheus-stack is installed

# Log level
logLevel: 2

# Global settings
global:
  logLevel: 2
