# External Secrets Operator Helm values for k3d

# Replica count
replicaCount: 1

# Resources
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Webhook resources
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Cert controller resources
certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Service monitor for Prometheus
serviceMonitor:
  enabled: false

# Install CRDs
installCRDs: true

# Process cluster-scoped store
processClusterStore: true

# Process cluster-scoped external secrets
processClusterExternalSecret: true
