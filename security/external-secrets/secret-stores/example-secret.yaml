# example-secret.yaml — ExternalSecret that pulls from the fake store
# This creates a Kubernetes Secret from the fake ClusterSecretStore values.
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-demo
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-database-credentials
  namespace: external-secrets-demo
spec:
  # Sync every 1 hour
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  # The Kubernetes Secret to create/update
  target:
    name: database-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Transform the secret data with templates
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@postgres:5432/appdb"
  # Pull specific keys from the store
  data:
    - secretKey: password
      remoteRef:
        key: /local/database/password
    - secretKey: username
      remoteRef:
        key: /local/database/username
---
# Example ExternalSecret pulling a valueMap (multiple keys from one path)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-app-config
  namespace: external-secrets-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: app-config
    creationPolicy: Owner
  # Extract all keys from a valueMap
  dataFrom:
    - extract:
        key: /local/app/config
