# Kyverno Helm values for k3d

# Replica count — 1 for local dev (3 for HA)
admissionController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

backgroundController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

cleanupController:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

reportsController:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Config
config:
  # Exclude system namespaces from policy enforcement
  excludeGroups: []
  excludeUsernames: []
  webhooks:
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values:
              - kube-system
              - kube-public
              - kube-node-lease
              - cert-manager
              - cilium-test

# Policy reports
policyReportsCleanup:
  enabled: true

# Grafana dashboard
grafana:
  enabled: false

# Metrics
serviceMonitor:
  enabled: false  # Enable after kube-prometheus-stack is installed
