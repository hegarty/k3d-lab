# test-pod.yaml — test Pod that writes to and reads from a local-path PVC
# Usage:
#   kubectl apply -f storage/local-path/test-pvc.yaml
#   kubectl apply -f storage/local-path/test-pod.yaml
#   kubectl logs local-path-test  # should print "Hello from local-path storage!"
#   kubectl delete pod local-path-test
#   kubectl delete pvc local-path-test-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: local-path-test
  namespace: default
  labels:
    app: local-path-test
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Writing to PVC..."
          echo "Hello from local-path storage! Written at $(date)" > /data/test.txt
          echo "Read back:"
          cat /data/test.txt
          echo "Storage test PASSED"
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: local-path-test-pvc
