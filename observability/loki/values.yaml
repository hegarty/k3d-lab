# Loki v6.x Helm values for k3d
# Using the "single binary" (monolithic) deployment mode for simplicity.

# Deployment mode: singleBinary (monolith) is best for local dev
deploymentMode: SingleBinary

loki:
  commonConfig:
    replication_factor: 1
  auth_enabled: false

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    max_query_parallelism: 4

  compactor:
    working_directory: /var/loki/compactor/retention
    delete_request_store: filesystem
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150

  ruler:
    enable_api: true

# Single binary mode — one StatefulSet for all components
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi

# Promtail is deployed as a DaemonSet to collect logs from nodes
promtail:
  enabled: false  # We use the standalone promtail or OpenTelemetry Collector

# Disable read/write/backend components (only needed for distributed mode)
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Loki gateway (nginx) for routing queries
gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Test section
test:
  enabled: false

# Monitoring — configure Loki's own metrics
monitoring:
  dashboards:
    enabled: true
    annotations:
      grafana_folder: Loki
  rules:
    enabled: true
    alerting: true
  serviceMonitor:
    enabled: false  # Enable after kube-prometheus-stack is installed
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
