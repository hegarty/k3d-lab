# gateway-class.yaml — GatewayClass definition
# NOTE: When using Cilium as the Gateway API controller, Cilium automatically
# creates a GatewayClass named "cilium". This file is kept for reference and
# for scenarios where you want to use a different controller name or add
# custom parameters.
#
# Do NOT apply this if Cilium is already managing the "cilium" GatewayClass.
# Check with: kubectl get gatewayclass
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
  annotations:
    # Describe which controller implements this class
    gateway.networking.k8s.io/owned-by: cilium
spec:
  # Cilium's controller name as registered in its CiliumConfig
  controllerName: io.cilium/gateway-controller
  description: "Cilium Gateway API controller — manages L4/L7 load balancing via eBPF"
