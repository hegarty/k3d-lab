# gateway.yaml — Istio Gateway and VirtualService for the lab
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: k3d-lab-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*.localhost"
        - "localhost"
      # Optionally redirect HTTP to HTTPS
      # tls:
      #   httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: k3d-tls
      hosts:
        - "*.localhost"
