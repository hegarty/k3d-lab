# network-policies.yaml — Kubernetes NetworkPolicy examples for network-test namespace
# These use standard Kubernetes NetworkPolicy (implemented by Cilium).
---
# Allow client to reach server within namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-to-server
  namespace: network-test
spec:
  podSelector:
    matchLabels:
      app: nettest-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: client
      ports:
        - port: 8080
          protocol: TCP
---
# Deny all ingress to isolated pod
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-to-isolated
  namespace: network-test
spec:
  podSelector:
    matchLabels:
      role: isolated
  policyTypes:
    - Ingress
    - Egress
  # No ingress or egress rules = deny all
---
# Allow DNS egress for all pods in namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: network-test
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Allow client egress to server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-egress
  namespace: network-test
spec:
  podSelector:
    matchLabels:
      role: client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              role: server
      ports:
        - port: 8080
          protocol: TCP
    # DNS
    - ports:
        - port: 53
          protocol: UDP
