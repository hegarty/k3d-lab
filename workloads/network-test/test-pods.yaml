# test-pods.yaml — network test pods for connectivity testing
# These pods are used to verify network policies and cross-namespace communication.
---
# Client pod — used to make requests from network-test namespace
apiVersion: v1
kind: Pod
metadata:
  name: nettest-client
  namespace: network-test
  labels:
    app: nettest-client
    role: client
spec:
  restartPolicy: Always
  containers:
    - name: client
      image: curlimages/curl:8.8.0
      command:
        - sh
        - -c
        - |
          echo "Network test client ready"
          # Keep running for exec-based testing
          while true; do sleep 3600; done
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
---
# Server pod — responds to requests within network-test namespace
apiVersion: v1
kind: Pod
metadata:
  name: nettest-server
  namespace: network-test
  labels:
    app: nettest-server
    role: server
spec:
  restartPolicy: Always
  containers:
    - name: server
      image: traefik/whoami:v1.10.3
      args:
        - --port=8080
        - --name=nettest-server
      ports:
        - containerPort: 8080
          name: http
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nettest-server
  namespace: network-test
  labels:
    app: nettest-server
spec:
  selector:
    app: nettest-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Isolated pod — for testing denied connections
apiVersion: v1
kind: Pod
metadata:
  name: nettest-isolated
  namespace: network-test
  labels:
    app: nettest-isolated
    role: isolated
spec:
  restartPolicy: Always
  containers:
    - name: isolated
      image: curlimages/curl:8.8.0
      command:
        - sh
        - -c
        - "while true; do sleep 3600; done"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
