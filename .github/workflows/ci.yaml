name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLUSTER_NAME: k3d-lab-ci
  CLUSTER_PROFILE: single-node

jobs:
  ##############################################################################
  # Lint and validate static files
  ##############################################################################
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell script syntax
        run: |
          echo "Checking shell scripts..."
          FAILED=0
          while IFS= read -r -d '' script; do
            if bash -n "$script"; then
              echo "OK: $script"
            else
              echo "FAIL: $script"
              FAILED=1
            fi
          done < <(find . -name "*.sh" -print0)
          [[ "$FAILED" -eq 0 ]] || exit 1

      - name: Validate YAML files
        run: |
          pip install yamllint --quiet
          yamllint -d relaxed clusters/ networking/ workloads/ security/ 2>&1 | \
            grep -v "^$" | head -50 || true

      - name: Check versions.env is complete
        run: |
          required=(
            CILIUM_VERSION GATEWAY_API_VERSION METALLB_VERSION
            ISTIO_VERSION PROMETHEUS_STACK_VERSION LOKI_VERSION
            TEMPO_VERSION OPENTELEMETRY_VERSION CERT_MANAGER_VERSION
            KYVERNO_VERSION EXTERNAL_SECRETS_VERSION K3S_IMAGE
          )
          source versions.env
          MISSING=0
          for var in "${required[@]}"; do
            if [[ -z "${!var:-}" ]]; then
              echo "Missing in versions.env: $var"
              MISSING=1
            else
              echo "OK: $var=${!var}"
            fi
          done
          [[ "$MISSING" -eq 0 ]] || exit 1

  ##############################################################################
  # Validate Helm values are parseable
  ##############################################################################
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Add Helm repos
        run: |
          helm repo add cilium https://helm.cilium.io/
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Load versions
        run: cat versions.env >> "$GITHUB_ENV"

      - name: Lint Cilium values
        run: |
          helm lint cilium/cilium \
            --version "${CILIUM_VERSION}" \
            --values networking/cilium/values.yaml \
            --set k8sServiceHost=127.0.0.1 \
            --set k8sServicePort=6443 || true

      - name: Lint kube-prometheus-stack values
        run: |
          helm lint prometheus-community/kube-prometheus-stack \
            --version "${PROMETHEUS_STACK_VERSION}" \
            --values observability/kube-prometheus-stack/values.yaml || true

      - name: Lint cert-manager values
        run: |
          helm lint jetstack/cert-manager \
            --version "${CERT_MANAGER_VERSION}" \
            --values security/cert-manager/values.yaml || true

      - name: Lint Kyverno values
        run: |
          helm lint kyverno/kyverno \
            --version "${KYVERNO_VERSION}" \
            --values security/kyverno/values.yaml || true

      - name: Lint External Secrets values
        run: |
          helm lint external-secrets/external-secrets \
            --version "${EXTERNAL_SECRETS_VERSION}" \
            --values security/external-secrets/values.yaml || true
