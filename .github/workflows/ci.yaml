name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLUSTER_NAME: k3d-lab-ci
  CLUSTER_PROFILE: single-node

jobs:
  ##############################################################################
  # Lint and validate static files
  ##############################################################################
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell script syntax
        run: |
          echo "Checking shell scripts..."
          FAILED=0
          while IFS= read -r -d '' script; do
            if bash -n "$script"; then
              echo "OK: $script"
            else
              echo "FAIL: $script"
              FAILED=1
            fi
          done < <(find . -name "*.sh" -print0)
          [[ "$FAILED" -eq 0 ]] || exit 1

      - name: Validate YAML files
        run: |
          pip install yamllint --quiet
          yamllint -d relaxed clusters/ networking/ workloads/ security/ 2>&1 | \
            grep -v "^$" | head -50 || true

      - name: Check versions.env is complete
        run: |
          required=(
            CILIUM_VERSION GATEWAY_API_VERSION METALLB_VERSION
            ISTIO_VERSION PROMETHEUS_STACK_VERSION LOKI_VERSION
            TEMPO_VERSION OPENTELEMETRY_VERSION CERT_MANAGER_VERSION
            KYVERNO_VERSION EXTERNAL_SECRETS_VERSION K3S_IMAGE
          )
          source versions.env
          MISSING=0
          for var in "${required[@]}"; do
            if [[ -z "${!var:-}" ]]; then
              echo "Missing in versions.env: $var"
              MISSING=1
            else
              echo "OK: $var=${!var}"
            fi
          done
          [[ "$MISSING" -eq 0 ]] || exit 1

  ##############################################################################
  # Integration test on a real k3d cluster
  ##############################################################################
  integration:
    name: Integration Test (single-node)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Load versions
        run: cat versions.env >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          # k3d
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | \
            TAG=v5.7.4 bash

          # kubectl
          curl -LO "https://dl.k8s.io/release/v1.30.2/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

          # helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

          # jq (usually pre-installed on GitHub runners)
          which jq || sudo apt-get install -y jq

          # Verify
          k3d version
          kubectl version --client
          helm version --short

      - name: Add Helm repos
        run: |
          helm repo add cilium https://helm.cilium.io/
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add metallb https://metallb.github.io/metallb
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

      - name: Make scripts executable
        run: find . -name "*.sh" -exec chmod +x {} \;

      - name: Create k3d cluster
        run: |
          k3d cluster create \
            --config clusters/single-node.yaml \
            --kubeconfig-update-default \
            --wait
          kubectl config use-context k3d-k3d-lab
          kubectl wait --for=condition=Ready nodes --all --timeout=120s
          kubectl get nodes

      - name: Install Cilium
        run: |
          CLUSTER_NAME=k3d-lab bash networking/cilium/install.sh
        env:
          CLUSTER_NAME: k3d-lab
          CILIUM_CONNECTIVITY_TEST: "false"

      - name: Install Gateway API
        run: |
          CLUSTER_NAME=k3d-lab bash networking/gateway-api/install.sh
        env:
          CLUSTER_NAME: k3d-lab

      - name: Deploy hello-world
        run: |
          CLUSTER_NAME=k3d-lab bash workloads/hello-world/install.sh
        env:
          CLUSTER_NAME: k3d-lab

      - name: Run smoke tests
        run: |
          CLUSTER_NAME=k3d-lab bash tests/smoke/run.sh
        env:
          CLUSTER_NAME: k3d-lab

      - name: Install cert-manager
        run: |
          CLUSTER_NAME=k3d-lab bash security/cert-manager/install.sh
        env:
          CLUSTER_NAME: k3d-lab

      - name: Install Kyverno
        run: |
          CLUSTER_NAME=k3d-lab bash security/kyverno/install.sh
        env:
          CLUSTER_NAME: k3d-lab

      - name: Install External Secrets
        run: |
          CLUSTER_NAME=k3d-lab bash security/external-secrets/install.sh
        env:
          CLUSTER_NAME: k3d-lab

      - name: Run security tests
        run: |
          CLUSTER_NAME=k3d-lab bash tests/security/run.sh
        env:
          CLUSTER_NAME: k3d-lab

      - name: Show cluster state on failure
        if: failure()
        run: |
          echo "=== Nodes ==="
          kubectl get nodes -o wide || true
          echo "=== All pods ==="
          kubectl get pods -A || true
          echo "=== Recent events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -30 || true
          echo "=== Cilium pods ==="
          kubectl describe pods -n kube-system -l k8s-app=cilium || true
          echo "=== Cilium logs ==="
          kubectl logs -n kube-system -l k8s-app=cilium --tail=50 || true

      - name: Cleanup
        if: always()
        run: k3d cluster delete k3d-lab 2>/dev/null || true

  ##############################################################################
  # Validate Helm values are parseable
  ##############################################################################
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Add Helm repos
        run: |
          helm repo add cilium https://helm.cilium.io/
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Load versions
        run: cat versions.env >> "$GITHUB_ENV"

      - name: Lint Cilium values
        run: |
          helm lint cilium/cilium \
            --version "${CILIUM_VERSION}" \
            --values networking/cilium/values.yaml \
            --set k8sServiceHost=127.0.0.1 \
            --set k8sServicePort=6443 || true

      - name: Lint kube-prometheus-stack values
        run: |
          helm lint prometheus-community/kube-prometheus-stack \
            --version "${PROMETHEUS_STACK_VERSION}" \
            --values observability/kube-prometheus-stack/values.yaml || true

      - name: Lint cert-manager values
        run: |
          helm lint jetstack/cert-manager \
            --version "${CERT_MANAGER_VERSION}" \
            --values security/cert-manager/values.yaml || true

      - name: Lint Kyverno values
        run: |
          helm lint kyverno/kyverno \
            --version "${KYVERNO_VERSION}" \
            --values security/kyverno/values.yaml || true

      - name: Lint External Secrets values
        run: |
          helm lint external-secrets/external-secrets \
            --version "${EXTERNAL_SECRETS_VERSION}" \
            --values security/external-secrets/values.yaml || true
